<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>KiwiEdtech TimeSheet Tracker App</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#071b17,#0f3d33,#0b1220);
      min-height:100vh;
      padding:40px;
      color:white;
    }

    .container{
      max-width:1250px;
      margin:auto;
    }

    .header{
      text-align:center;
      margin-bottom:35px;
    }

    .header h1{
      font-size:42px;
      font-weight:700;
      background:linear-gradient(to right,#4ade80,#22c55e,#bbf7d0);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .header p{
      margin-top:10px;
      color:#cbd5e1;
      font-size:15px;
    }

    .card{
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      backdrop-filter:blur(14px);
      border-radius:24px;
      padding:30px;
      margin-bottom:30px;
      box-shadow:0 10px 35px rgba(0,0,0,0.35);
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .input-group{
      display:flex;
      flex-direction:column;
    }

    .input-group label{
      margin-bottom:8px;
      font-size:14px;
      color:#d1fae5;
    }

    .input-group input,
    .input-group textarea,
    .input-group select{
      padding:14px;
      border-radius:14px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:14px;
    }

    .input-group textarea{
      height:120px;
      resize:none;
    }

    select option{
      color:black;
    }

    .buttons{
      margin-top:25px;
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:14px 24px;
      border-radius:14px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s ease;
      font-size:14px;
    }

    .save-btn{
      background:#22c55e;
      color:white;
    }

    .save-btn:hover{
      background:#16a34a;
      transform:translateY(-2px);
    }

    .refresh-btn{
      background:#f59e0b;
      color:white;
    }

    .refresh-btn:hover{
      background:#d97706;
      transform:translateY(-2px);
    }

    .export-btn{
      background:#0ea5e9;
      color:white;
    }

    .export-btn:hover{
      background:#0284c7;
      transform:translateY(-2px);
    }

    .table-wrapper{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      overflow:hidden;
      border-radius:16px;
    }

    thead{
      background:#22c55e;
    }

    thead th{
      padding:16px;
      text-align:left;
      font-size:14px;
    }

    tbody tr{
      background:rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.08);
    }

    tbody td{
      padding:16px;
      font-size:14px;
      color:#e2e8f0;
    }

    .footer{
      text-align:center;
      margin-top:25px;
      color:#94a3b8;
      font-size:13px;
    }

    @media(max-width:768px){

      body{
        padding:20px;
      }

      .header h1{
        font-size:30px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>KiwiEdtech TimeSheet Tracker App</h1>
    <p>AI Enabled Workforce Tracking System</p>
  </div>

  <div class="card">

    <div class="form-grid">

      <div class="input-group">
        <label>Employee Name</label>

        <select id="employee">
          <option value="">Select Employee</option>
          <option value="Abinaya">Abinaya</option>
          <option value="Shivani">Shivani</option>
        </select>
      </div>

      <div class="input-group">
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div class="input-group">
        <label>Task</label>
        <input type="text" id="task" placeholder="Enter Task">
      </div>

      <div class="input-group">
        <label>Hours</label>
        <input type="number" step="0.25" id="hours" placeholder="Enter Hours">
      </div>

    </div>

    <div class="input-group" style="margin-top:20px;">
      <label>Description</label>
      <textarea id="description" placeholder="Enter Description"></textarea>
    </div>

    <div class="buttons">

      <button class="save-btn" onclick="saveEntry()">
        Save Entry
      </button>

      <button class="refresh-btn" onclick="fetchData()">
        Refresh Data
      </button>

      <button class="export-btn" onclick="exportExcel()">
        Export Excel
      </button>

    </div>

  </div>

  <div class="card table-wrapper">

    <table id="timesheetTable">

      <thead>
        <tr>
          <th>Employee</th>
          <th>Date</th>
          <th>Task</th>
          <th>Description</th>
          <th>Hours</th>
        </tr>
      </thead>

      <tbody></tbody>

    </table>

  </div>

  <div class="footer">
    Powered by KiwiEdtech • Smart Productivity Tracking
  </div>

</div>

<script>

  // ============================================
  // PASTE YOUR SHEETDB API URL BELOW
  // ============================================

  const SHEETDB_API = "https://sheetdb.io/api/v1/1gxsp0de3xrbv";

  // ============================================

  let timesheetData = [];

  async function saveEntry(){

    const employee = document.getElementById("employee").value;
    const date = document.getElementById("date").value;
    const task = document.getElementById("task").value;
    const description = document.getElementById("description").value;
    const hours = document.getElementById("hours").value;

    if(!employee || !date || !task || !description || !hours){

      alert("Please fill all fields");

      return;

    }

    const data = {

      data:[{

        Employee: employee,
        Date: date,
        Task: task,
        Description: description,
        Hours: hours

      }]

    };

    try{

      const response = await fetch(SHEETDB_API,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

      });

      const result = await response.json();

      alert("Entry Saved Successfully!");

      clearForm();

      fetchData();

    }

    catch(error){

      console.error(error);

      alert("Error Saving Data");

    }

  }

  async function fetchData(){

    try{

      const response = await fetch(SHEETDB_API);

      const data = await response.json();

      timesheetData = data.reverse();

      renderTable();

    }

    catch(error){

      console.error(error);

    }

  }

  function renderTable(){

    const tbody = document.querySelector("#timesheetTable tbody");

    tbody.innerHTML = "";

    timesheetData.forEach(item => {

      const row = `

        <tr>

          <td>${item.Employee}</td>
          <td>${item.Date}</td>
          <td>${item.Task}</td>
          <td>${item.Description}</td>
          <td>${item.Hours}</td>

        </tr>

      `;

      tbody.innerHTML += row;

    });

  }

  function clearForm(){

    document.getElementById("employee").value = "";
    document.getElementById("date").value = "";
    document.getElementById("task").value = "";
    document.getElementById("description").value = "";
    document.getElementById("hours").value = "";

  }

  function exportExcel(){

    const worksheet = XLSX.utils.json_to_sheet(timesheetData);

    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(workbook, worksheet, "Timesheet");

    XLSX.writeFile(workbook, "KiwiEdtech_Timesheet.xlsx");

  }

  // AUTO LOAD DATA

  fetchData();

</script>

</body>

</html>
